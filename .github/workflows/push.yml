on:
  push:
    branches:
      - master

name: Build and Publish
jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'no-ci')"
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.12.1
      uses: actions/setup-node@v4
      with:
        node-version: 20.12.1
        registry-url: https://registry.npmjs.org
    - name: Cache node_modules
      id: cache-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.OS }}-build-${{ hashFiles('package.json') }}
    - name: Install Dependencies
      if: steps.cache-modules.outputs.cache-hit != 'true'
      run: npm install
    - name: Build types
      run: npm run build
    - name: Debug npm auth source
      run: |
        echo "NODE_AUTH_TOKEN is set? -> ${NODE_AUTH_TOKEN:+yes}"
        echo "NPM_TOKEN is set? -> ${NPM_TOKEN:+yes}"
        echo "NPM_AUTH_TOKEN is set? -> ${NPM_AUTH_TOKEN:+yes}"
        echo "--- repo .npmrc ---"
        test -f .npmrc && (ls -la .npmrc && sed -n '1,120p' .npmrc) || echo "(none)"
        echo "--- home .npmrc ---"
        test -f ~/.npmrc && (ls -la ~/.npmrc && sed -n '1,120p' ~/.npmrc) || echo "(none)"
        echo "--- npm config authToken ---"
        npm config get //registry.npmjs.org/:_authToken || true
    - name: Sync version from npm
      run: |
        PUBLISHED_VERSION=$(npm view next-static-images-gallery version)
        echo "Published version: $PUBLISHED_VERSION"
        npm pkg set version=$PUBLISHED_VERSION
    - name: Bump patch version
      run: npm version patch --no-git-tag-version
    - name: Publish to npm
      run: npm publish
