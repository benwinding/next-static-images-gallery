on:
  push:
    branches:
      - master

name: Build and Publish
jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'no-ci')"
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org/
    - name: Cache node_modules
      id: cache-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.OS }}-build-${{ hashFiles('package.json') }}
    - name: Install Dependencies
      if: steps.cache-modules.outputs.cache-hit != 'true'
      run: npm install
    - name: Build types
      run: npm run build
    - name: Sync version from npm
      run: |
        PUBLISHED_VERSION=$(npm view next-static-images-gallery version)
        echo "Published version: $PUBLISHED_VERSION"
        npm pkg set version=$PUBLISHED_VERSION
    - name: Bump patch version
      run: npm version patch --no-git-tag-version
    - name: Force OIDC (remove token-based auth)
      run: |
        echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"
        echo "NPM_TOKEN=" >> "$GITHUB_ENV"
        echo "NPM_AUTH_TOKEN=" >> "$GITHUB_ENV"
        if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
          rm -f "$NPM_CONFIG_USERCONFIG"
        fi
        unset NPM_CONFIG_USERCONFIG
        rm -f ~/.npmrc .npmrc || true
    - name: Publish to npm
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ""
        NPM_TOKEN: ""
        NPM_AUTH_TOKEN: ""
